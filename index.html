<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stadshoeve Vrijwilligers</title>
  <!-- Het uiterlijk van de app staat in stijl.css -->
  <link rel="stylesheet" href="stijl.css">

  <!-- Installeerbaar maken (app-icoon op het beginscherm) -->
  <!-- manifest.json: naam, icoon en kleur van de app -->
  <link rel="manifest" href="manifest.json">
  <!-- Kleur van de balk bovenin de telefoon (zelfde groen als in stijl.css) -->
  <meta name="theme-color" content="#2e5d34">
  <!-- Icoon in het tabblad van de browser -->
  <link rel="icon" href="iconen/icoon-192.png">
  <!-- iPhone leest het manifest maar half; daarom deze regels apart -->
  <link rel="apple-touch-icon" href="iconen/icoon-180.png">
  <meta name="apple-mobile-web-app-title" content="Stadshoeve">
</head>
<body>
  <header>
    <h1 id="titel">Even geduld…</h1>
    <div class="knoppen-boven">
      <!-- Alleen voor beheerders (zie beheer.js en startApp in app.js) -->
      <button id="knop-beheer" class="knop-uitloggen" hidden>Beheer</button>
      <!-- Verschijnt pas als je bent ingelogd (zie inloggen.js) -->
      <button id="knop-uitloggen" class="knop-uitloggen" hidden>Uitloggen</button>
    </div>
  </header>

  <!-- Hier zet het script de inhoud van het scherm neer -->
  <main id="inhoud"></main>

  <!-- Melding die even verschijnt na een actie -->
  <div id="melding" class="melding" role="status" aria-live="polite" hidden>
    <span id="melding-tekst"></span>
    <button id="knop-ongedaan">Ongedaan maken</button>
  </div>

  <!-- Menu: "data-scherm" zegt welk scherm bij de knop hoort -->
  <nav hidden>
    <button data-scherm="mijn">Mijn taken</button>
    <button data-scherm="werkgroep">Werkgroep</button>
    <button data-scherm="melden">Melden</button>
    <button data-scherm="meldingen">Meldingen</button>
  </nav>

  <!-- Scripts staan onderaan, zodat de pagina eerst geladen is. Volgorde is belangrijk. -->
  <!-- 1. Hulpbestand van Supabase (vaste versie, zodat het niet onverwacht verandert) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <!-- 2. Adres en sleutel van de database -->
  <script src="instellingen.js"></script>
  <!-- 3. Inloggen en "wie ben ik" -->
  <script src="inloggen.js"></script>
  <!-- 4. Beheerscherm (alleen voor beheerders) -->
  <script src="beheer.js"></script>
  <script src="beheer-lijsten.js"></script>
  <!-- 5. De app zelf: schermen en voorbeeldgegevens -->
  <script src="app.js"></script>
</body>
</html>
